<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Wi-Fi</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #111827;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 90%;
        }
        h1 {
            font-size: 20px;
            color: #f59e0b;
            margin-bottom: 5px;
        }
        p {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 25px;
        }
        .qr-box {
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }
        .qr-box img {
            display: block;
            max-width: 100%;
            height: auto;
            width: 250px;
            margin: 0 auto;
        }
        .btn-close {
            display: inline-block;
            background-color: #374151;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }
        .btn-close:hover {
            background-color: #4b5563;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Conexão Supervisionada</h1>
        <p>Apenas para uso imediato no pagamento</p>
        
        <!-- Puxando o link absoluto direto da CDN do seu GitHub público para burlar o cache do navegador -->
        <div class="qr-box">
            <img src="https://githubusercontent.com" alt="QR Code de Conexão">
        </div>
        
        <div>
            <a href="adm.html" class="btn-close">Fechar e Voltar</a>
        </div>
    </div>

</body>
</html>
