<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Mairiporã Agro ✨ - Pagamento Seguro</title>
    <style>
        :root {
            --primary: #2e7d32;
            --bg: #f5f5f5;
            --card-bg: #ffffff;
            --text: #333333;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }
        .container {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 24px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .header-system { 
            font-size: 20px; 
            font-weight: bold; 
            color: #ffffff !important; 
            background: #cc0000 !important; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            font-family: monospace; 
            display: block; 
            line-height: 1.4; 
            border: 1px solid #990000; 
        }
        .header h1 { font-size: 1.4rem; color: var(--primary); margin: 0 0 8px 0; }
        .badge { background: #e8f5e9; color: var(--primary); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; display: inline-block; margin-bottom: 20px; }
        
        .resumo-box {
            background: #f9f9f9;
            border: 1px dashed #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: left;
        }
        .resumo-linha { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 1rem; }
        .resumo-linha:last-child { margin-bottom: 0; font-weight: bold; border-top: 1px solid #eee; padding-top: 8px; }
        
        .qr-section img { max-width: 200px; width: 100%; margin: 15px 0; border: 1px solid #eee; padding: 10px; background: #fff; border-radius: 8px; }
        
        .pix-code-box {
            background: #f1f3f4;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.9rem;
            word-break: break-all;
            margin-bottom: 12px;
            border: 1px solid #e0e0e0;
        }
        .btn-acao { background-color: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-share { background-color: #17a2b8; color: white; }
    </style>
</head>
<body onload="iniciarRelogio()">

<div class="container">
    <div class="header-system">
        ⏱️ SISTEMA: 29/08/2026 <span id="live-clock">Carregando...</span>
    </div>

    <div class="header">
        <h1>Mairiporã Agro</h1>
        <div class="badge">🔒 Pix Copia e Cola Seguro</div>
    </div>

    <div class="resumo-box">
        <div class="resumo-linha"><span>Produto:</span> <span>Ovos de Codorna Jumbo</span></div>
        <div class="resumo-linha"><span>Valor unitário:</span> <span>R$ 13,00</span></div>
        <div class="resumo-linha"><span>Total:</span> <span>R$ 13,00</span></div>
    </div>

    <div class="qr-section">
        <p>Aproxime a câmera para pagar via QR Code:</p>
        <img src="./qrcode-pagamento.png" alt="QR Code Pix Mairiporã Agro">
    </div>

    <p>Ou utilize o código Copia e Cola abaixo:</p>
    <div class="pix-code-box" id="pixCode">00020126360014BR.GOV.BCB.PIX0114seuPixAqui4971</div>

    <button class="btn-acao" onclick="copiarPix()">📋 Copiar Código Pix</button>
    <button class="btn-acao btn-share" onclick="compartilharLoja()">🔗 Compartilhar Site e Comprovantes</button>
</div>

<script>
    function iniciarRelogio() {
        atualizarTempo(); 
        setInterval(atualizarTempo, 1000);
    }

    function atualizarTempo() {
        const agora = new Date();
        const horas = String(agora.getHours()).padStart(2, '0');
        const minutes = String(agora.getMinutes()).padStart(2, '0');
        const segundos = String(agora.getSeconds()).padStart(2, '0');
        const relogio = document.getElementById('live-clock');
        if (relogio) {
            relogio.innerText = `${horas}:${minutes}:${segundos}`;
        }
    }

    function copiarPix() {
        const txt = document.getElementById('pixCode').innerText;
        navigator.clipboard.writeText(txt).then(() => {
            alert('Código Pix copiado com sucesso!');
        }).catch(() => {
            alert('Erro ao copiar automaticamente. Selecione o texto manualmente.');
        });
    }

    function compartilharLoja() {
        if (navigator.share) {
            navigator.share({
                title: 'Mairiporã Agro',
                text: 'Compre Ovos de Codorna Jumbo direto do produtor local!',
                url: window.location.origin
            }).catch(console.error);
        } else {
            navigator.clipboard.writeText(window.location.origin);
            alert('Link da loja copiado para a área de transferência!');
        }
    }
</script>
</body>
</html>
