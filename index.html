<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairiporã Agro - Checkout Seguro</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f4f7f6; text-align: center; padding: 40px 20px; color: #333; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 360px; margin: auto; border-top: 5px solid #32bcad; }
        .produto-img { font-size: 50px; margin-bottom: 10px; }
        h2 { margin-top: 0; color: #2c3e50; }
        .preco { color: #27ae60; font-size: 28px; font-weight: bold; margin: 15px 0; }
        .btn-pix { background: #32bcad; color: white; border: none; padding: 14px 20px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.3s; }
        .btn-pix:hover { background: #28a193; }
        .alerta { font-size: 12px; color: #7f8c8d; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="produto-img">🥚✨</div>
        <h2>Mairiporã Agro</h2>
        <p>Produto: <strong>Bandeja de Ovos Caipiras (Homologação)</strong></p>
        <div class="preco">R$ 1,99</div>
        
        <!-- Esse botão joga o comando direto para o seu VSCode local -->
        <form action="http://127.0.0" method="post">
            <input type="hidden" name="valor" value="1.99">
            <input type="hidden" name="nome_pagador" value="Amigo Oculto (Migué)">
            <button type="submit" class="btn-pix">PAGAR R$ 1,99 VIA PIX</button>
        </form>
        
        <p class="alerta">🔒 Ambiente de teste integrado ao sistema JCS_Software.</p>
    </div>

</body>
</html>
