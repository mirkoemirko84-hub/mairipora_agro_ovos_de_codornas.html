<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Conservas - Início</title>
    <style>
        :root {
            --primary-color: #d97706;
            --background-color: #f3f4f6;
            --card-color: #ffffff;
            --text-color: #1f2937;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-color);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 24px;
        }
        p {
            color: #4b5563;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #b45309;
        }
        .btn-secondary {
            background-color: #4b5563;
        }
        .btn-secondary:hover {
            background-color: #374151;
        }
        .version {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div>🥚🚀</div>
        <h1>Sistema de Monitoramento</h1>
        <p>Selecione uma das opções abaixo para acessar o painel ou iniciar as rotinas.</p>
        
        <a href="adm.html" class="btn">Acessar Painel ADM</a>
        <a href="#" class="btn btn-secondary" onclick="alert('Iniciando rotina de testes...')">Iniciar Teste da Salmoura</a>
        
        <div class="version">Versão 26.08.31.22.1</div>
    </div>

</body>
</html>
