<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairiporã Agro - Pix Copia e Cola</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
            color: #333;
            text-align: center;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        h2 { color: #28a745; margin-top: 0; }
        .valor-destaque {
            font-size: 24px;
            font-weight: bold;
            color: #222;
            margin: 15px 0;
            padding: 10px;
            background: #e9ecef;
            border-radius: 8px;
        }
        .input-pix {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 2px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            background: #f8f9fa;
            color: #555;
            text-align: center;
            margin-bottom: 15px;
        }
        .btn-copiar {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            transition: background 0.2s;
        }
        .btn-copiar:hover { background-color: #0056b3; }
        .btn-avancar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .btn-avancar:hover { background-color: #218838; }
        .alerta-sucesso {
            color: #155724;
            background-color: #d4edda;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Pix Copia e Cola</h2>
    <p>Copie o código abaixo e pague no aplicativo do seu banco.</p>
    
    <!-- Valor total dinâmico e travado -->
    <div class="valor-destaque" id="txt-total">R$ 0,00</div>

    <!-- Código Pix para cópia -->
    <input type="text" class="input-pix" id="payload-pix" readonly value="mairipora.agro.pix.fake.payload.1234567890">

    <div class="alerta-sucesso" id="msg-sucesso">✓ Código Pix copiado com sucesso!</div>

    <button class="btn-copiar" onclick="copiarPix()">Copiar Código Pix</button>
    
    <!-- Redirecionamento blindado para o compartilhamento -->
    <button class="btn-avancar" onclick="concluirPedido()">Já paguei, enviar comprovante</button>
</div>

<script>
    // Recupera os parâmetros da URL de forma segura
    const urlParams = new URLSearchParams(window.location.search);
    const totalRaw = urlParams.get('total') || '0';
    const numPedido = urlParams.get('pedido') || '';

    // Trata e formata o valor em formato Real (R$) estrito
    let valorNumerico = parseFloat(totalRaw.replace(',', '.'));
    if (isNaN(valorNumerico)) valorNumerico = 0;
    
    document.getElementById('txt-total').innerText = valorNumerico.toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
    });

    // Função moderna para copiar para a área de transferência
    function copiarPix() {
        const inputCopia = document.getElementById('payload-pix');
        inputCopia.select();
        inputCopia.setSelectionRange(0, 99999); // Suporte para dispositivos móveis

        navigator.clipboard.writeText(inputCopia.value).then(() => {
            const msg = document.getElementById('msg-sucesso');
            msg.style.display = 'block';
            setTimeout(() => { msg.style.display = 'none'; }, 4000);
        }).catch(err => {
            console.error('Erro ao copiar código: ', err);
        });
    }

    // Avança o circuito repassando as variáveis para a tela certa
    function concluirPedido() {
        window.location.href = "compartilhamento.html" + window.location.search;
    }
</script>

</body>
</html>
