<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairiporã Agro - Redirecionando...</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .loader-container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #007bff;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="loader-container">
    <div class="spinner"></div>
    <p>Ajustando conexão segura... Você será redirecionado em instantes.</p>
</div>

<script>
    (function() {
        // Captura todos os parâmetros da URL atual (ex: ?total=50&pedido=123)
        const urlParams = window.location.search;
        
        // Define o novo destino mantendo os dados da compra intactos
        const novoDestino = "compartilhamento.html" + urlParams;
        
        // Executa o redirecionamento imediato e seguro
        window.location.replace(novoDestino);
    })();
</script>

</body>
</html>
