<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mairiporã Agro | Faturamento</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #cc092f; /* FUNDO VERMELHO */
            color: #ffffff; /* LETRAS BRANCAS */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #cc092f; /* FUNDO VERMELHO COESO */
            padding: 30px;
            border: 2px solid #ffffff; /* BORDA BRANCA */
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 { color: #ffffff; margin-top: 0; font-size: 24px; }
        .info {
            background: rgba(255, 255, 255, 0.1); /* FUNDO SEMI-TRANSPARENTE */
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ffffff;
            text-align: left;
            margin-bottom: 25px;
            font-size: 16px;
        }
        .info p { margin: 8px 0; color: #ffffff; }
        .btn-pdf {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #ffffff;
            color: #cc092f;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn-pdf:hover { background-color: #f1f5f9; }
    </style>
</head>
<body>
<div class="container">
    <h2>Resumo do Faturamento</h2>
    
    <div class="info">
        <p><strong>Beneficiário:</strong> Mairiporã Agro (Bradesco)</p>
        <p><strong>Pagador:</strong> <span id="resumoCliente">...</span></p>
        <p><strong>Valor Gerado:</strong> R$ <span id="resumoValor">...</span></p>
    </div>
    
    <a href="boleto_mairipora_agro.pdf" target="_blank" style="text-decoration: none;">
        <button class="btn-pdf">Visualizar Boleto Híbrido (PDF)</button>
    </a>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('resumoCliente').innerText = params.get('cliente') || 'Cliente Homologação';
    document.getElementById('resumoValor').innerText = params.get('valor') || '1,99';
</script>
</body>
</html>
