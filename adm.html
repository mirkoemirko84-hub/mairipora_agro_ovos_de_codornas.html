<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JCS Admin App</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#17509e">
    <style>
        body { font-family: Arial, sans-serif; background-color: #EFEFEF; margin: 0; padding: 0; user-select: none; }
        .app-header { background-color: #17509e; color: white; padding: 15px; font-size: 20px; font-weight: bold; text-align: center; box-shadow: 0px 2px 5px rgba(0,0,0,0.2); }
        .app-container { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .app-label { font-size: 16px; color: #333333; font-weight: bold; margin-bottom: -5px; }
        .control-box { background-color: #ffffff; border: 2px solid #cccccc; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .counter-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .counter-value { font-size: 26px; font-weight: bold; color: #17509e; min-width: 60px; text-align: center; font-family: monospace; }
        .btn-calc { background-color: #34495e; color: white; border: none; font-size: 24px; font-weight: bold; width: 55px; height: 55px; border-radius: 8px; cursor: pointer; box-shadow: 0px 3px 0px rgba(0,0,0,0.2); }
        .btn-calc:active { transform: scale(0.95); }
        .btn-zerar { background-color: #cc092f; color: white; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; box-shadow: 0px 2px 0px rgba(0,0,0,0.2); }
        .app-button { width: 100%; padding: 18px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0px 3px 0px rgba(0,0,0,0.2); display: block; box-sizing: border-box; text-align: center; text-decoration: none; }
        .btn-gray { background-color: #6c757d; margin-top: 15px; }
        .app-notifier { background-color: #333; color: white; padding: 10px; border-radius: 5px; text-align: center; position: fixed; bottom: 20px; left: 20px; right: 20px; display: none; font-size: 14px; z-index: 1000; }
    </style>
</head>
<body onload="carregarDadosAdmin()">
    <div class="app-header">JCS_Software - Controle Total</div>
    <div class="app-container">
        <div class="app-label">📦 Estoque de Cartelas Produzidas:</div>
        <div class="control-box">
            <div class="counter-row">
                <button class="btn-calc" onclick="alterarEstoque(-1)">-</button>
                <div id="val-estoque" class="counter-value">03</div>
                <button class="btn-calc" onclick="alterarEstoque(1)">+</button>
            </div>
            <button class="btn-zerar" onclick="zerarEstoque()">🛑 ZERAR ESTOQUE (ESGOTADO)</button>
        </div>
        <hr style="width:100%; border:0; border-top:1px solid #ccc; margin:5px 0;">
        <div class="app-label">🔒 Estoque de Reserva (Unidades):</div>
        <div class="control-box">
            <div class="counter-row">
                <button class="btn-calc" onclick="alterarReservas(-1)">-</button>
                <div id="val-reservas" class="counter-value">16</div>
                <button class="btn-calc" onclick="alterarReservas(1)">+</button>
            </div>
            <button class="btn-zerar" onclick="zerarReservas()">🛑 ZERAR RESERVAS</button>
        </div>
        <hr style="width:100%; border:0; border-top:1px solid #ccc; margin:10px 0;">
        <a href="./index.html" class="app-button btn-gray">⬅️ SAIR E VOLTAR PARA A LOJA</a>
    </div>
    <div id="notifier" class="app-notifier"></div>
    <script>
        let estoque = 3;
        let reservas = 16;
        function carregarDadosAdmin() {
            estoque = parseInt(localStorage.getItem('jcs_estoque_atual')) || 3;
            reservas = parseInt(localStorage.getItem('jcs_reservas_atual')) || 16;
            atualizarValoresTela();
        }
        function atualizarValoresTela() {
            document.getElementById('val-estoque').textContent = String(estoque).padStart(2, '0');
            document.getElementById('val-reservas').textContent = String(reservas).padStart(2, '0');
        }
        function alterarEstoque(valor) {
            estoque = Math.max(0, estoque + valor); 
            localStorage.setItem('jcs_estoque_atual', estoque);
            atualizarValoresTela();
            dispararNotificador(`Estoque alterado para ${estoque} cartela(s)!`);
        }
        function zerarEstoque() {
            estoque = 0;
            localStorage.setItem('jcs_estoque_atual', 0);
            atualizarValoresTela();
            dispararNotificador("Estoque zerado com sucesso!");
        }
        function alterarReservas(valor) {
            reservas = Math.max(0, reservas + valor); 
            localStorage.setItem('jcs_reservas_atual', reservas);
            atualizarValoresTela();
            dispararNotificador(`Reservas alteradas para ${reservas} unidade(s)!`);
        }
        function zerarReservas() {
            reservas = 0;
            localStorage.setItem('jcs_reservas_atual', 0);
            atualizarValoresTela();
            dispararNotificador("Reservas zeradas com sucesso!");
        }
        function dispararNotificador(mensagem) {
            const caixaAlerta = document.getElementById('notifier');
            if (caixaAlerta) {
                caixaAlerta.textContent = mensagem; 
                caixaAlerta.style.display = 'block';
                tocarBipeSucesso();
                setTimeout(() => { caixaAlerta.style.display = 'none'; }, 2000);
            }
        }
        function tocarBipeSucesso() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime); 
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) { console.log("Áudio aguardando clique."); }
        }
    </script>
</body>
</html>
