<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JCS Admin App</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #EFEFEF; margin: 0; padding: 20px; user-select: none; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { width: 100%; max-width: 450px; background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid #e0e0e0; }
        .app-header { background-color: #17509e; color: white; padding: 15px; font-size: 20px; font-weight: bold; text-align: center; }
        .app-container { padding: 20px; display: flex; flex-direction: column; gap: 15px; text-align: left; }
        .app-label { font-size: 16px; color: #333333; font-weight: bold; margin-bottom: -5px; }
        .control-box { background-color: #ffffff; border: 2px solid #cccccc; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .counter-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .counter-value { font-size: 26px; font-weight: bold; color: #17509e; min-width: 60px; text-align: center; font-family: monospace; }
        .btn-calc { background-color: #34495e; color: white; border: none; font-size: 24px; font-weight: bold; width: 55px; height: 55px; border-radius: 8px; cursor: pointer; }
        .btn-zerar { background-color: #cc092f; color: white; border: none; padding: 12px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; text-align: center; }
        .app-button { width: 100%; padding: 18px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 8px; display: block; box-sizing: border-box; text-align: center; text-decoration: none; }
        .btn-gray { background-color: #6c757d; margin-top: 5px; }
        .btn-orange { background-color: #e67e22; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; text-align: center; margin-top: 5px; cursor: pointer; }
        .btn-status-online { background-color: #27ae60; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; text-align: center; cursor: pointer; }
        .btn-status-manutencao { background-color: #d35400; color: white; border: none; padding: 15px; font-size: 16px; font-weight: bold; border-radius: 6px; width: 100%; text-align: center; cursor: pointer; }
        .area-restrita { padding: 30px 20px; text-align: center; }
        .input-senha { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 8px; box-sizing: border-box; margin: 15px 0; text-align: center; }
        .credits-footer { padding: 15px; font-size: 11px; color: #7f8c8d; border-top: 1px dashed #bdc3c7; background: #fafafa; text-align: center; font-family: monospace; }
        
        /* Alertas */
        .toast-alerta { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #333; color: white; padding: 12px 25px; border-radius: 30px; font-size: 14px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: transform 0.3s ease-in-out; z-index: 1000; }
        .toast-alerta.show { transform: translateX(-50%) translateY(0); }
        .toast-sucesso { background: #27ae60; }
        .toast-erro { background: #cc092f; }
    </style>
</head>
<body onload="verificarSessaoInicial()">

<div id="toastNotificacao" class="toast-alerta"></div>

<div class="container">
    <!-- BLOCO DE LOGIN -->
    <div id="loginBlock" class="area-restrita">
        <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
        <h2 style="margin: 0; color: #17509e;">Painel Administrativo</h2>
        <p style="color: #666; font-size: 14px;">Identificação Obrigatória do Produtor</p>
        <input type="password" id="senhaAcesso" class="input-senha" placeholder="Digite a senha de ADM" autofocus>
        <button class="btn-status-online" onclick="validarSenha()">Entrar no Painel 🔑</button>
        <a class="app-button btn-gray" href="./index.html" style="font-size: 14px; padding: 12px;">⬅️ Cancelar e Voltar</a>
    </div>

    <!-- CONTEÚDO DO ADMINISTRADOR -->
    <div id="adminContent" style="display: none;">
        <div class="app-header">🛠️ PAINEL DE CONTROLE v2.2</div>
        <div class="app-container">
            <div class="app-label">📦 Estoque de Cartelas Atual:</div>
            <div class="control-box">
                <div class="counter-row">
                    <button class="btn-calc" onclick="alterarEstoque(-1)">-</button>
                    <div class="counter-value" id="lblEstoque">16</div>
                    <button class="btn-calc" onclick="alterarEstoque(1)">+</button>
                </div>
                <button class="btn-zerar" onclick="zerarEstoque()">Zerar Estoque ❌</button>
            </div>

            <div class="app-label">🔒 Ovos Reservados (Unidades):</div>
            <div class="control-box">
                <div class="counter-row">
                    <button class="btn-calc" onclick="alterarReservas(-1)">-</button>
                    <div class="counter-value" id="lblReservas">16</div>
                    <button class="btn-calc" onclick="alterarReservas(1)">+</button>
                </div>
                <button class="btn-zerar" onclick="zerarReservas()">Limpar Reservas 🔄</button>
            </div>

            <div class="app-label">🚦 Status de Vendas do Site:</div>
            <button id="btnStatusSite" class="btn-status-online" onclick="alternarStatusSite()">🟢 Loja Online / Ativa</button>

            <div class="app-label">🧪 Testes de Validação e Cache:</div>
            <button class="btn-orange" onclick="limparDadosCache()">Forçar Limpeza de Cache Local 🌀</button>
            <button class="app-button btn-gray" onclick="deslogarPainel()">🔒 Sair do Painel</button>
        </div>
        <div class="credits-footer">JCS SISTEMA v2.2 • PROTEGIDO</div>
    </div>
</div>

<script>
    function mostrarToast(mensagem, tipo = 'sucesso') {
        const toast = document.getElementById('toastNotificacao');
        toast.innerText = mensagem;
        toast.className = 'toast-alerta ' + (tipo === 'sucesso' ? 'toast-sucesso' : 'toast-erro');
        toast.classList.add('show');
        setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    function verificarSessaoInicial() {
        if (sessionStorage.getItem('adm_autenticado') === 'true') {
            document.getElementById('loginBlock').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            carregarValoresIniciais();
        }
        document.getElementById('senhaAcesso').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') validarSenha();
        });
    }

    function validarSenha() {
        const senhaDigitada = document.getElementById('senhaAcesso').value;
        if (senhaDigitada === "4971") {
            sessionStorage.setItem('adm_autenticado', 'true');
            document.getElementById('loginBlock').style.display = 'none';
            document.getElementById('adminContent').style.display = 'block';
            carregarValoresIniciais();
            mostrarToast("Acesso liberado! 🔓");
        } else {
            mostrarToast("Senha Incorreta! ❌", "erro");
            document.getElementById('senhaAcesso').value = '';
            document.getElementById('senhaAcesso').focus();
        }
    }

    function deslogarPainel() {
        sessionStorage.removeItem('adm_autenticado');
        document.getElementById('adminContent').style.display = 'none';
        document.getElementById('loginBlock').style.display = 'block';
        document.getElementById('senhaAcesso').value = '';
    }

    function carregarValoresIniciais() {
        let estoque = localStorage.getItem('prod_estoque') || 16;
        let reservas = localStorage.getItem('prod_reservas') || 16;
        let statusSite = localStorage.getItem('prod_status_site') || 'online';

        document.getElementById('lblEstoque').innerText = estoque;
        document.getElementById('lblReservas').innerText = reservas;
        atualizarBotaoStatusInterface(statusSite);
    }

    function alterarEstoque(valor) {
        let atual = parseInt(document.getElementById('lblEstoque').innerText) || 0;
        let novo = Math.max(0, atual + valor);
        document.getElementById('lblEstoque').innerText = novo;
        localStorage.setItem('prod_estoque', novo);
    }

    function zerarEstoque() {
        if(confirm("Zerar estoque disponível?")) {
            document.getElementById('lblEstoque').innerText = 0;
            localStorage.setItem('prod_estoque', 0);
        }
    }

    function alterarReservas(valor) {
        let atual = parseInt(document.getElementById('lblReservas').innerText) || 0;
        let novo = Math.max(0, atual + valor);
        document.getElementById('lblReservas').innerText = novo;
        localStorage.setItem('prod_reservas', novo);
    }

    function zerarReservas() {
        if(confirm("Limpar reservas?")) {
            document.getElementById('lblReservas').innerText = 0;
            localStorage.setItem('prod_reservas', 0);
        }
    }

    function alternarStatusSite() {
        let statusAtual = localStorage.getItem('prod_status_site') || 'online';
        let novoStatus = (statusAtual === 'online') ? 'manutencao' : 'online';
        localStorage.setItem('prod_status_site', novoStatus);
        atualizarBotaoStatusInterface(novoStatus);
    }

    function atualizarBotaoStatusInterface(status) {
        const btn = document.getElementById('btnStatusSite');
        if (status === 'online') {
